services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infraasset
      POSTGRES_PASSWORD: infraasset
      POSTGRES_DB: infraasset
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infraasset"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: infraasset
      MINIO_ROOT_PASSWORD: infraasset-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  api:
    build:
      context: ../../apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://infraasset:infraasset@postgres:5432/infraasset
      REDIS_URL: redis://redis:6379/0
      DEMO_SEED: "true"
      WEB_ORIGIN: http://localhost:3000
      APP_SECRET_KEY: local-dev-secret-change-me
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
